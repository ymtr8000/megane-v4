        <!-- キープする大元のスタイルシートをそのまま読み込みます -->
        <link rel="stylesheet" href="../style-v4.css">
        
        <!-- 🎯 トップページを壊さない、このページ専用のインラインメニューデザイン -->
        <style>
            .sub-page {
                overflow-y: auto !important;
                background-color: #ffffff !important;
            }
            /* 上部の白い文字エリア */
            .gallery-header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                background-color: #ffffff;
                z-index: 1000;
                padding: 35px 0 20px 0;
            }
            .header-container {
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                position: relative;
                padding: 0 20px; 
                box-sizing: border-box;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
            
            /* 開いたときの「MEGANE」の文字 */
            .nav-title-main {
                margin: 0;
                font-size: 1.15rem;   
                font-weight: 800;     
                letter-spacing: 3px;  
                color: #111111;
                line-height: 1;
                opacity: 1;
                transition: opacity 0.3s ease;
            }
            
            /* 🎯【新設計】ワープを防ぎ、10倍の超スローで確実に滑らせるためのメニューベース */
            .nav-inline-links {
                display: flex; /* 最初から配置の計算だけは終わらせておきます */
                width: 100%; 
                justify-content: space-between; 
                
                /* 💡 初期状態（タップ前）は、完全に透明にして、右側に50px分引っ込めて眠らせておきます */
                opacity: 0;
                visibility: hidden;
                transform: translateX(50px); 
                
                /* 🎯 速度を「4.0s（4秒）」に変更し、1/10の速度でじっくり動くように設定しました */
                transition: opacity 2.0s ease, transform 2.0s cubic-bezier(0.16, 1, 0.3, 1), visibility 4.0s;
            }
            
            /* メニュー文字 */
            .nav-inline-links a {
                text-decoration: none;
                color: #111111;
                font-size: 1rem;      
                font-weight: 800;     
                letter-spacing: 3px;  
            }
            .nav-inline-links a.current-page {
                border-bottom: 2px solid #111111;
                padding-bottom: 2px;
            }
            
            /* チェックボックスを使ったCSS限定の切り替えスイッチ */
            #menu-toggle {
                display: none;
            }
            /* 三本線ボタンの見た目 */
            .gallery-menu-label {
                width: 30px;
                height: 20px;
                cursor: pointer;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                opacity: 1;
                transition: opacity 0.3s ease;
            }
            .gallery-menu-label span {
                display: block;
                width: 100%;
                height: 2px;
                background-color: #111111;
            }
            
            /* 🎯 三本線がタップされた（チェックが入った）瞬間の10倍スロー動き */
            #menu-toggle:checked ~ .nav-inline-links {
                opacity: 1;
                visibility: visible;
                transform: translateX(0); /* 4秒かけて、右端から本来の位置へじわじわと滑り出します */
            }
            #menu-toggle:checked ~ .nav-title-main {
                opacity: 0;
                visibility: hidden;
                display: none;
            }
            #menu-toggle:checked ~ .gallery-menu-label {
                opacity: 0;
                visibility: hidden;
                display: none;
            }
            
            .gallery-container {
                width: 100%;
                margin-top: 100px; 
                padding: 0;
            }
            body.sub-page > .menu-trigger {
                display: none !important;
            }
        </style>
    </head>
