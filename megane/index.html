        <!-- 🎯 すっきりしたお気に入りのサイズ感をキープしたまま、右端のEを100%完全吸着させるデザイン -->
        <style>
            html, body.sub-page {
                height: auto !important;
                min-height: 100% !important;
                overflow-x: hidden !important;
                overflow-y: scroll !important; 
                background-color: #ffffff !important;
            }
            
            body.sub-page {
                display: block !important;
            }
            
            /* 上部の完全透明な文字エリア枠 */
            .gallery-header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                background-color: transparent !important; 
                backdrop-filter: none !important; 
                z-index: 1000;
                padding: 35px 0 20px 0;
                transition: transform 0.3s ease-in-out; 
                transform: translateY(0);
            }
            
            /* 下の方の画像を見に行くときに、文字エリアを上空へ消し去る命令クラス */
            .gallery-header.header-hide {
                transform: translateY(-100%) !important; 
            }
            
            .header-container {
                width: 100%;
                max-width: 1200px;
                margin: 0 auto;
                position: relative;
                /* 写真一覧のグリッド（左右20px空き）のラインと外枠を完全に一致させます */
                padding: 0 20px; 
                box-sizing: border-box;
                display: flex;
                justify-content: space-between;
                align-items: center; 
                height: 24px; 
            }
            
            /* 開く前の「MEGANE」の文字 */
            .nav-title-main {
                margin: 0;
                font-size: 1.15rem;   
                font-weight: 800;     
                letter-spacing: 3px;  
                color: #111111;
                line-height: 1; 
                display: inline-block;
            }
            
            /* 横一列のメニュー */
            .nav-inline-links {
                display: none; 
                width: 100%; 
                justify-content: space-between; 
                align-items: baseline; /* 4つの文字の底辺を一直線上に揃えます */
                opacity: 0;
                visibility: hidden;
                transform: translateX(30px); 
                transition: opacity 2.0s ease, transform 2.0s cubic-bezier(0.16, 1, 0.3, 1), visibility 2.0s;
            }
            
            #menu-toggle:checked ~ .nav-inline-links {
                display: flex !important; 
                opacity: 1;
                visibility: visible;
                transform: translateX(0); 
            }
            
            /* 展開した時の4つのメニュー文字 */
            .nav-inline-links a {
                text-decoration: none;
                color: #111111;
                font-size: 1rem;      /* 💡 お気に入りのすっきりしたサイズ感を100%キープ */
                font-weight: 800;     
                
                /* 🎯【最終微調整】文字間隔を3pxから「5px」へほんのわずかだけ広げました */
                /* これにより、文字サイズを大きくすることなく、最後のEの右端を右側のラインに完璧に吸着させます */
                letter-spacing: 5px;  
                
                line-height: 1;
                display: inline-block;
                position: relative;
                padding: 0;
            }
            
            /* MEGANEの下線設定 */
            .nav-inline-links a.current-page {
                border-bottom: 2px solid #111111; /* 構造が最も安定する標準の下線に戻しました */
                padding-bottom: 4px;
            }
            
            #menu-toggle {
                display: none;
            }
            
            /* 右上の三本線（写真の右端ラインと完璧に位置が重なります） */
            .gallery-menu-label {
                position: absolute; 
                top: 50%;           
                transform: translateY(-50%); 
                right: 20px;        
                width: 16px;        
                height: 14px;       
                cursor: pointer;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                opacity: 1;
                z-index: 1100;   
                transition: opacity 0.3s ease;
            }
            .gallery-menu-label span {
                display: block;
                width: 100%;
                height: 2.5px;      
                background-color: #111111;
            }
            
            #menu-toggle:checked ~ .nav-title-main {
                opacity: 0;
                visibility: hidden;
                display: none;
            }
            #menu-toggle:checked ~ .gallery-menu-label {
                opacity: 0;
                visibility: hidden;
                display: none;
            }
            
            .gallery-container {
                width: 100%;
                margin-top: 90px; 
                padding: 0;
            }
            body.sub-page > .menu-trigger {
                display: none !important;
            }
        </style>

        <!-- 🎯【メニュー展開対応版】リンクが出現していても、スクロールに合わせて丸ごと出し入れする最新プログラム -->
        <script>
            document.addEventListener('DOMContentLoaded', () => {
                    const header = document.getElementById('gallery-header');
                    const menuToggle = document.getElementById('menu-toggle');
                    
                    let lastScrollY = window.pageYOffset || document.documentElement.scrollTop;
                    
                    // 💡 三本線がタップされてメニューが開いたことを検知する設定
                    menuToggle.addEventListener('change', () => {
                            if (menuToggle.checked) {
                                header.classList.add('menu-opened'); // 開いている間はうっすら白半透明を敷く
                            } else {
                                header.classList.remove('menu-opened');
                            }
                    });
                    
                    window.addEventListener('scroll', () => {
                            const currentScrollY = window.pageYOffset || document.documentElement.scrollTop;
                            
                            // 💡 メニューが開いている（4つのリンクが出ている）状態でも、容赦なく上下にスライド出し入れさせます
                            // 1. 下の方の画像を見に行くとき、文字エリア全体を上空へ隠す
                            if (currentScrollY > lastScrollY && currentScrollY > 50) {
                                header.classList.add('header-hide');
                            } 
                            // 2. 上の画像を見る方向に動いた瞬間、4つのリンクごとスッと出現させる
                            else if (currentScrollY < lastScrollY) {
                                header.classList.remove('header-hide');
                            }
                            
                            // 3. 画面のてっぺん付近（最上部）にいるかどうかの白半透明切り替え
                            if (currentScrollY > 30) {
                                header.classList.add('scrolled');
                            } else {
                                header.classList.remove('scrolled');
                            }
                            
                            lastScrollY = currentScrollY <= 0 ? 0 : currentScrollY;
                    }, { passive: true });
            });
        </script>
