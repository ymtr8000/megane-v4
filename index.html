<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>KENTARO YAMAMOTO - Portfolio</title>
        <link rel="stylesheet" href="style-v4.css">
    </head>
    <body>
        
        <!-- 右上の三本線メニューボタン（最前面に配置） -->
        <button id="menu-btn" class="menu-trigger" aria-label="メニューを開く">
            <span></span>
            <span></span>
            <span></span>
        </button>
        
        <!-- タップ後に全面に広がるメニュー画面 -->
        <div id="full-menu" class="overlay-menu">
            <button id="close-btn" class="menu-close-btn">&times;</button>
            <nav class="overlay-menu-nav">
                <a href="index.html">HOME</a>
                <div class="nav-divider"></div>
                <a href="megane/index.html">MEGANE</a>
                <div class="nav-divider"></div>
                <a href="portrait/index.html">PORTRAIT</a>
                <div class="nav-divider"></div>
                <a href="snap/index.html">SNAP</a>
            </nav>
        </div>
        
        <main class="container">
        <!-- 縦長写真（1200×2200）に完全に吸い付き、他スマホでも絶対にズレない高精度SVGオーバーレイ構造 -->
        <section class="hero-container">
            
            <!-- イラストレーターから書き出した縦長画像を確実に読み込みます -->
            <img src="images/top-1200x2200moji-ari.jpg" alt="Top Image" class="hero-img">
            
            <!-- 新しい画像サイズに合わせて、viewBoxの基準を「0 0 1200 2200」に最適化 -->
            <svg class="svg-overlay" viewBox="0 0 1200 2200" xmlns="http://w3.org">
            
            <!-- 2200pxの高さに合わせて、文字やロゴの上にぴったり重なるよう配置 -->
            <!-- MEGANE リンク -->
            <a href="megane/index.html">
                <rect x="30" y="1480" width="600" height="95" class="clickable-area" />
            </a>
            
            <!-- PORTRAIT リンク -->
            <a href="portrait/index.html">
                <rect x="30" y="1575" width="600" height="95" class="clickable-area" />
            </a>
            
            <!-- SNAP リンク -->
            <a href="snap/index.html">
                <rect x="30" y="1670" width="600" height="95" class="clickable-area" />
            </a>
            
            <!-- Instagram リンク（右下のロゴマークの上にジャストフィット） -->
            <a href="https://instagram.com" target="_blank">
                <rect x="1050" y="1670" width="110" height="110" class="clickable-area" />
            </a>
            
            </svg>
            
            <!-- ピリオド無しの新型オン・フォトフッター（写真の上に重なります） -->
            <div class="hero-footer">
                <p>&copy; 2026 KENTARO YAMAMOTO</p>
            </div>
            
        </section>
        </main>
        
        <script src="script.js"></script>
    </body>
</html>
