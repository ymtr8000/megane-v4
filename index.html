<!DOCTYPE html>
<html lang="ja">

    <body>
        
        <!-- 右上の三本線メニューボタン -->
        <button id="menu-btn" class="menu-trigger" aria-label="メニューを開く">

            <svg class="svg-overlay" viewBox="0 0 1200 2600" xmlns="http://w3.org">

                <rect x="1050" y="1980" width="120" height="120" class="clickable-area" />
            </a>
            </svg>
            
            <!-- 🛠️ 最後のピリオド「.」を消してスッキリさせる場合 -->
            <div class="hero-footer">
                <p>&copy; 2026 KENTARO YAMAMOTO</p>
